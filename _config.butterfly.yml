# Butterfly 主题配置

# 菜单
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

# 社交链接
social:
  fas fa-envelope: mailto:qxwhub@users.noreply.github.com || Email
  fab fa-github: https://github.com/qxwhub || Github

# 头像
avatar:
  img: /img/avatar.png
  effect: false

# 页脚
footer:
  owner:
    enable: true
    since: 2024
  custom_text:
  copyright: true

# 文章页面
post:
  meta:
    date_type: created
    date_format: YYYY-MM-DD
    categories: true
    tags: true
    label: true
  copyright:
    enable: true
    default: 本博客所有文章除特别声明外，均采用 CC BY-NC-SA 4.0 许可协议。转载请注明出处！

# 页面加载动画
preloader:
  enable: false

# 返回顶部
back_to_top:
  enable: true
  auto: false
  percent: true

# 主题颜色
theme_color:
  enable: true
  active: #49B1F5
  paginator: #00c4b6
  button_hover: #FF7242
  text_selection: #00c4b6
  link_color: #99a9bf
  meta_color: #858585
  hr_color: #A4D8FA
  code_foreground: #F47466
  code_background: rgba(27, 31, 35, .05)
  toc_color: #00c4b6
  blockquote_padding_color: #49b1f5
  blockquote_background_color: #49b1f5
  scrollbar_color: #49b1f5
  meta_theme_color: #49b1f5

# 分页
pagination:
  per_page: 10
  auto_hide: false
  simplify: false

# 字数统计
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 数学公式
math:
  use: false
  per_page: true
  hide_scrollbar: false
  mathjax:
    enable: true
    per_page: true
  katex:
    enable: false
    per_page: false
    hide_scrollbar: false

# 本地搜索
local_search:
  enable: true
  preload: false
  top_n_per_article: 1
  unescape: false

# 评论区（默认关闭）
comments:
  use: false
  text: true
  lazyload: false
  count: false
  card_post_meta: false

# 深色模式
dark_mode:
  enable: true
  button: true
  auto: false

# 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/qxwhub
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！
  card_recent_post:
    enable: true
    limit: 5
    sort: true
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# 代码块
highlight_theme: mac light
highlight_copy: true
highlight_lang: true
highlight_shrink: false
